name: Bug report
description: Report a problem with Isolattice
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. If the problem lets a workload
        escape its sandbox or weakens a required policy, stop here and report it
        privately through the security policy instead.

  - type: input
    id: version
    attributes:
      label: Isolattice version
      description: Output of `python -c "import importlib.metadata as m; print(m.version('isolattice'))"`.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: "3.12.10"
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - Podman
        - Docker API
        - Kubernetes Pod
        - Linux namespaces
        - Windows Job Object
        - Windows AppContainer
        - A custom Backend subclass
        - Backend selection or discovery
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Engine and host
      description: >
        Operating system and version, and the engine details that apply: Podman or Docker
        version and whether the engine is rootful or rootless, the Kubernetes version, or the
        delegated cgroup controllers.
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A minimal, runnable script, including the SandboxPolicy and backend configuration.
      render: python
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Relevant log output or traceback
      description: Remove secrets and workload data before pasting.
      render: shell
